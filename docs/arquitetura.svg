<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6172"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <rect x="20" y="210" width="130" height="80" rx="12" fill="#f1f3f8"/>
  <text x="85" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1f3b">Navegador</text>
  <text x="85" y="267" text-anchor="middle" font-size="13" fill="#5b6172">envia o áudio</text>

  <rect x="200" y="40" width="330" height="440" rx="16" fill="#1b1f3b"/>
  <text x="365" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Processo principal (app.py)</text>
  <text x="365" y="94" text-anchor="middle" font-size="13" fill="#c9cee0">o gerente</text>

  <rect x="222" y="112" width="286" height="52" rx="10" fill="#2a2f55"/>
  <text x="240" y="135" font-size="14" font-weight="700" fill="#ffffff">Thread web (Flask)</text>
  <text x="240" y="154" font-size="12" fill="#c9cee0">páginas, envio de arquivos, /metrics</text>

  <rect x="222" y="174" width="286" height="96" rx="10" fill="#f2a541"/>
  <text x="240" y="198" font-size="14" font-weight="700" fill="#1b1f3b">Escalonador + Lock</text>
  <text x="240" y="218" font-size="12" fill="#1b1f3b">fila de jobs protegida por exclusão mútua</text>
  <text x="240" y="238" font-size="12" fill="#1b1f3b">política FIFO ou SJF</text>
  <text x="240" y="258" font-size="12" fill="#1b1f3b">ffprobe mede a duração (processo filho)</text>

  <rect x="222" y="280" width="138" height="66" rx="10" fill="#2a2f55"/>
  <text x="236" y="303" font-size="14" font-weight="700" fill="#ffffff">Thread ouvinte</text>
  <text x="236" y="322" font-size="12" fill="#c9cee0">lê os pipes,</text>
  <text x="236" y="338" font-size="12" fill="#c9cee0">despacha jobs</text>

  <rect x="370" y="280" width="138" height="66" rx="10" fill="#2a2f55"/>
  <text x="384" y="303" font-size="14" font-weight="700" fill="#ffffff">Thread vigia</text>
  <text x="384" y="322" font-size="12" fill="#c9cee0">recria worker morto,</text>
  <text x="384" y="338" font-size="12" fill="#c9cee0">devolve o semáforo</text>

  <rect x="222" y="356" width="286" height="50" rx="10" fill="#2a2f55"/>
  <text x="240" y="378" font-size="14" font-weight="700" fill="#ffffff">SQLite</text>
  <text x="240" y="396" font-size="12" fill="#c9cee0">histórico e transcrições prontas</text>

  <rect x="222" y="416" width="286" height="48" rx="10" fill="#c94a4a"/>
  <text x="365" y="437" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Semáforo do motor</text>
  <text x="365" y="455" text-anchor="middle" font-size="12" fill="#ffffff">1 vaga na GPU · núcleos ÷ 4 na CPU</text>

  <line x1="150" y1="250" x2="198" y2="250" stroke="#5b6172" stroke-width="2" marker-end="url(#seta)"/>

  <g>
    <rect x="610" y="40" width="250" height="120" rx="14" fill="#f1f3f8"/>
    <text x="628" y="68" font-size="16" font-weight="700" fill="#1b1f3b">Worker 1 · PID próprio</text>
    <text x="628" y="92" font-size="13" fill="#5b6172">1. ffmpeg converte (processo filho)</text>
    <text x="628" y="114" font-size="13" fill="#5b6172">2. espera o semáforo</text>
    <text x="628" y="136" font-size="13" fill="#5b6172">3. transcreve com o Whisper</text>
  </g>
  <g>
    <rect x="610" y="190" width="250" height="120" rx="14" fill="#f1f3f8"/>
    <text x="628" y="218" font-size="16" font-weight="700" fill="#1b1f3b">Worker 2 · PID próprio</text>
    <text x="628" y="242" font-size="13" fill="#5b6172">thread do sinal de vida</text>
    <text x="628" y="264" font-size="13" fill="#5b6172">a cada 2 s pelo pipe</text>
  </g>
  <g>
    <rect x="610" y="340" width="250" height="100" rx="14" fill="#f1f3f8"/>
    <text x="628" y="368" font-size="16" font-weight="700" fill="#1b1f3b">Worker N</text>
    <text x="628" y="392" font-size="13" fill="#5b6172">criados com multiprocessing</text>
    <text x="628" y="414" font-size="13" fill="#5b6172">(modo spawn)</text>
  </g>

  <line x1="532" y1="140" x2="606" y2="100" stroke="#5b6172" stroke-width="2" marker-end="url(#seta)" marker-start="url(#seta)"/>
  <line x1="532" y1="250" x2="606" y2="250" stroke="#5b6172" stroke-width="2" marker-end="url(#seta)" marker-start="url(#seta)"/>
  <line x1="532" y1="360" x2="606" y2="390" stroke="#5b6172" stroke-width="2" marker-end="url(#seta)" marker-start="url(#seta)"/>
  <text x="569" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#5b6172">Pipe</text>

  <rect x="890" y="130" width="96" height="220" rx="14" fill="#c94a4a"/>
  <text x="938" y="225" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Motor</text>
  <text x="938" y="248" text-anchor="middle" font-size="13" fill="#ffffff">GPU NVIDIA</text>
  <text x="938" y="266" text-anchor="middle" font-size="13" fill="#ffffff">ou CPU</text>
  <line x1="860" y1="100" x2="888" y2="180" stroke="#c94a4a" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="860" y1="250" x2="888" y2="250" stroke="#c94a4a" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="860" y1="390" x2="888" y2="320" stroke="#c94a4a" stroke-width="2" marker-end="url(#seta)"/>

  <rect x="200" y="500" width="330" height="44" rx="10" fill="#fdf1df"/>
  <text x="365" y="527" text-anchor="middle" font-size="14" fill="#1b1f3b"><tspan font-weight="700">Prometheus</tspan> lê /metrics a cada 2 s → <tspan font-weight="700">Grafana</tspan></text>
  <line x1="365" y1="482" x2="365" y2="498" stroke="#5b6172" stroke-width="2" marker-end="url(#seta)"/>
</svg>
